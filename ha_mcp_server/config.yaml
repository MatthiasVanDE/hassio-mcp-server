---
# Home Assistant add-on: an MCP server on top of Home Assistant's own APIs.
#
# WHY THIS ADD-ON EXISTS: the built-in mcp_server integration only publishes what
# has been exposed to Assist, and it cannot configure anything. This add-on turns
# the full REST, WebSocket and Supervisor APIs into MCP tools. It runs on the Home
# Assistant machine itself, so it is always up and reachable from any device -- not
# only from the one computer that happens to be running an MCP client.
name: MCP Server (Home Assistant API)
version: "2.0.0"
slug: ha_mcp_server
description: >-
  Expose the full Home Assistant REST, WebSocket and Supervisor API as MCP tools over HTTP.
url: https://github.com/MatthiasVanDE/hassio-mcp-server
stage: stable

# A plain `FROM python:3.12-slim` image, which upstream publishes for all of these.
arch:
  - aarch64
  - amd64
  - armv7
  - i386

# `services` = start after Home Assistant, because the first thing it does is call
# the core API. `auto` = come back up after the host reboots.
startup: services
boot: auto

# One Python process that handles SIGTERM itself; the s6 layer adds nothing here.
init: false

# THE HEART OF BOTH THE SECURITY AND THE ACCESS MODEL:
# homeassistant_api gives the container a SUPERVISOR_TOKEN with which it may call
# the core API through http://supervisor/core/api. That means NO long-lived access
# token has to be stored in the configuration -- the token is managed and rotated
# by the Supervisor. hassio_role: manager adds add-on management on top, and is
# also what makes /core/logs and /host/logs readable.
homeassistant_api: true
hassio_api: true
hassio_role: manager

# Binary data (a backup, a camera snapshot) cannot travel through an MCP response,
# which is text. The server writes such files into the `share` folder and returns
# the path; you open it over Samba or the File editor. The same folder catches
# responses that are too large to inline, and is the source for uploads.
map:
  - type: share
    read_only: false

# If /health fails to answer three times, the Supervisor restarts the container.
# That is the difference between "it runs" and "it is in production".
watchdog: "http://[HOST]:[PORT:8099]/health"

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: MCP endpoint (streamable HTTP on /mcp, SSE on /sse)

options:
  # Bearer token an MCP client must send. Empty = the add-on refuses to start; that
  # is deliberate, since an open port here would mean full administrative access to
  # your home for anyone who can reach it.
  token: ""
  log_level: info

schema:
  token: password
  log_level: list(debug|info|warning|error)
  # Optional IANA time zone override. Left out, the add-on asks Home Assistant which
  # time zone it runs in, which is what you want in nearly every case.
  timezone: str?
