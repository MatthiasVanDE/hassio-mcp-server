---
# Home Assistant add-on: an MCP server on top of Home Assistant's own APIs.
#
# WHY THIS ADD-ON EXISTS: the built-in mcp_server integration only publishes what
# has been exposed to Assist, and it cannot configure anything. This add-on turns
# the full REST, WebSocket and Supervisor APIs into MCP tools. It runs on the Home
# Assistant machine itself, so it is always up and reachable from any device -- not
# only from the one computer that happens to be running an MCP client.
name: MCP Server (Home Assistant API)
version: "2.1.0"
slug: ha_mcp_server
description: >-
  Expose the full Home Assistant REST, WebSocket and Supervisor API as MCP tools over HTTP.
url: https://github.com/MatthiasVanDE/hassio-mcp-server

# PREBUILT IMAGE. Without this line the Supervisor builds the Dockerfile on the user's
# own machine at install time: minutes of compiling on a Raspberry Pi, a download of
# the whole Python toolchain, and a different result depending on the day. With it,
# installing is a pull of the image that CI built and signed off on for this exact
# version tag. `{arch}` is substituted by the Supervisor; the tag it pulls is the
# `version` above, which is why .github/workflows/release.yaml refuses to publish
# unless the tag, this version and the changelog agree.
image: ghcr.io/matthiasvande/{arch}-addon-ha-mcp-server

# Not declared because they are already the defaults, and the add-on linter rejects
# repeating a default: `stage: stable`, `backup: hot` (nothing in the container is
# state worth stopping the add-on for; the token lives in /data, which the Supervisor
# backs up anyway) and `panel_admin: true` (see below).

# THE ADD-ON'S OWN PAGE ("OPEN WEB UI"), on a port of its own.
# It shows the endpoint, the token with a copy button, a ready-made client
# configuration and the tool list -- the things a new user would otherwise have to
# assemble out of the documentation. The Supervisor authenticates the visitor before
# proxying anything here, and the default `panel_admin: true` keeps the sidebar entry
# to administrators. The server additionally checks group membership itself before it
# prints the token, because that panel setting governs the sidebar, not the URL.
ingress: true
ingress_port: 8098
panel_icon: mdi:robot-happy-outline
panel_title: MCP Server

# The two architectures Home Assistant still supports; armv7 and i386 were dropped in
# Home Assistant 2025.12. Upstream publishes python:3.12-slim for both, so one plain
# `FROM` covers them without a build matrix.
arch:
  - aarch64
  - amd64

# `services` = start after Home Assistant, because the first thing it does is call
# the core API.
startup: services

# One Python process that handles SIGTERM itself; the s6 layer adds nothing here.
init: false

# THE HEART OF BOTH THE SECURITY AND THE ACCESS MODEL:
# homeassistant_api gives the container a SUPERVISOR_TOKEN with which it may call
# the core API through http://supervisor/core/api. That means NO long-lived access
# token has to be stored in the configuration -- the token is managed and rotated
# by the Supervisor. hassio_role: manager adds add-on management on top, and is
# also what makes /core/logs and /host/logs readable.
homeassistant_api: true
hassio_api: true
hassio_role: manager

# Binary data (a backup, a camera snapshot) cannot travel through an MCP response,
# which is text. The server writes such files into the `share` folder and returns
# the path; you open it over Samba or the File editor. The same folder catches
# responses that are too large to inline, and is the source for uploads.
map:
  - type: share
    read_only: false

# Restarting an unhealthy container is handled by the Docker HEALTHCHECK in the
# Dockerfile, which polls /health. The add-on `watchdog` option that used to do this
# is obsolete.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: MCP endpoint (streamable HTTP on /mcp, SSE on /sse)

options:
  # Bearer token an MCP client must send. Left empty, the add-on generates one on
  # first start, keeps it in /data so it survives restarts and updates, and shows it
  # on its own page and in its log. The port is therefore never unauthenticated --
  # which matters, because reaching it means full administrative access to the house.
  token: ""
  log_level: info

schema:
  token: password
  log_level: list(debug|info|warning|error)
  # Optional IANA time zone override. Left out, the add-on asks Home Assistant which
  # time zone it runs in, which is what you want in nearly every case.
  timezone: str?
